name: Apply Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.101.0

      - name: Configure migration target
        id: target
        shell: bash
        run: |
          if [[ -n "$SUPABASE_DB_URL" ]]; then
            echo "mode=db-url" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          project_ref="$SUPABASE_PROJECT_REF"
          if [[ -z "$project_ref" && "$SUPABASE_URL" =~ ^https://([^.]+)\.supabase\.co/?$ ]]; then
            project_ref="${BASH_REMATCH[1]}"
          fi

          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$project_ref" ]]; then
            cat >&2 <<'EOF'
          No Supabase database credentials were found in GitHub.

          Add SUPABASE_DB_URL to the GitHub production environment, or add all of:
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_REF (SUPABASE_URL may be used instead)

          Vercel environment variables are not shared with GitHub Actions, and a
          service-role key cannot execute schema migrations.
          EOF
            exit 1
          fi

          supabase link --project-ref "$project_ref" --password "$SUPABASE_DB_PASSWORD"
          echo "mode=linked" >> "$GITHUB_OUTPUT"

      - name: Preview pending migrations using database URL
        if: steps.target.outputs.mode == 'db-url'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Preview pending migrations using linked project
        if: steps.target.outputs.mode == 'linked'
        run: supabase db push --linked --include-all --dry-run

      - name: Apply pending migrations using database URL
        if: steps.target.outputs.mode == 'db-url'
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --yes

      - name: Apply pending migrations using linked project
        if: steps.target.outputs.mode == 'linked'
        run: supabase db push --linked --include-all --yes
