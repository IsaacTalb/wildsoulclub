name: Apply Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: production-supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify database secret
        shell: bash
        run: |
          if [[ -z "$SUPABASE_DB_URL" ]]; then
            echo "SUPABASE_DB_URL must be configured in the production GitHub environment." >&2
            exit 1
          fi

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --include-all
